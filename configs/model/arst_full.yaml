# ============================================================
# ARST Full Model Configuration
# ============================================================

# @package _global_

defaults:
  - _self_

model:
  name: "arst_full"
  type: "arst"              # "arst" | "baseline_mlp" | "baseline_cnn" | ...

  # --- Shared Embedding Dimension ---
  d_model: 256

  # --- IMU Encoder ---
  imu_encoder:
    type: "cnn_transformer"
    in_channels: 6
    d_model: ${model.d_model}
    cnn:
      kernel_sizes: [3, 7, 15]
      n_filters: 64
      dropout: 0.1
    transformer:
      num_layers: 2
      num_heads: 4
      d_ff: 512
      dropout: 0.1
    pos_encoding: "sinusoidal"   # "sinusoidal" | "learned"

  # --- Thermal Encoder ---
  thermal_encoder:
    type: "linear_transformer"   # "linear_transformer" | "conv2d_transformer"
    in_channels: 64              # 8x8 flattened
    d_model: ${model.d_model}
    transformer:
      num_layers: 2
      num_heads: 4
      d_ff: 512
      dropout: 0.1
    pos_encoding: "sinusoidal"

  # --- ToF Encoder ---
  tof_encoder:
    type: "linear_transformer"
    in_channels: 64
    d_model: ${model.d_model}
    shared_with_thermal: false   # ablation: share weights with thermal encoder
    invalid_embedding: true      # learned null embedding for invalid readings
    transformer:
      num_layers: 2
      num_heads: 4
      d_ff: 512
      dropout: 0.1
    pos_encoding: "sinusoidal"

  # --- Reliability Module ---
  reliability:
    enabled: true
    activation: "sigmoid"        # "sigmoid" | "softmax"
    d_hidden: 64                 # D // 4
    dropout: 0.1
    init_bias: 0.0               # sigmoid(0) = 0.5 → equal initial reliability

  # --- Adaptive Fusion Transformer ---
  fusion:
    type: "adaptive"             # "adaptive" | "concat" | "mean" | "weighted_sum"
    num_layers: 4
    num_heads: 8
    d_model: ${model.d_model}
    d_ff: 1024
    dropout: 0.1
    attention_dropout: 0.1
    use_reliability_bias: true
    use_modal_tokens: true
    pool_type: "cls"             # "cls" | "mean"

  # --- Classification Head ---
  classification_head:
    d_hidden: 256
    num_classes: ???             # filled at runtime from dataset
    dropout: 0.1
    activation: "gelu"

  # --- Weight Initialization ---
  init:
    type: "xavier_uniform"       # "xavier_uniform" | "kaiming_normal"
    seed: 42
