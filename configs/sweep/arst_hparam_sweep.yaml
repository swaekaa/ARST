# ============================================================
# W&B Hyperparameter Sweep Configuration — ARST Full
# ============================================================
# Usage: wandb sweep configs/sweep/arst_hparam_sweep.yaml
#        wandb agent <sweep-id>

program: scripts/train.py

method: bayes                  # "bayes" | "random" | "grid"
metric:
  goal: maximize
  name: val/f1_macro

parameters:
  # Learning rate
  training.optimizer.lr:
    distribution: log_uniform_values
    min: 1.0e-5
    max: 1.0e-3

  # Reliability loss weight
  training.loss.lambda_rel:
    values: [0.0, 0.01, 0.05, 0.1, 0.5]

  # Reliability activation
  model.reliability.activation:
    values: ["sigmoid", "softmax"]

  # Fusion transformer depth
  model.fusion.num_layers:
    values: [2, 4, 6]

  # Embedding dimension
  model.d_model:
    values: [128, 256]

  # Batch size (with gradient accumulation)
  training.batch_size:
    values: [16, 32]
  training.accumulation_steps:
    values: [4, 8]

  # Weight decay
  training.optimizer.weight_decay:
    distribution: log_uniform_values
    min: 1.0e-4
    max: 1.0e-1

early_terminate:
  type: hyperband
  s: 2
  eta: 3
  max_iter: 100
