name: arst
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip>=23.0

  # PyTorch with CUDA 12.1 (RTX 3060 compatible)
  - pytorch::pytorch=2.2.*
  - pytorch::torchvision=0.17.*
  - pytorch::torchaudio=2.2.*
  - pytorch::pytorch-cuda=12.1

  # Scientific computing
  - numpy>=1.26.0
  - scipy>=1.12.0
  - pandas>=2.2.0
  - scikit-learn>=1.4.0

  # Data formats
  - pyarrow>=15.0
  - h5py>=3.10

  # Development
  - jupyter
  - ipykernel
  - ipywidgets
  - matplotlib>=3.8
  - seaborn>=0.13
  - plotly>=5.18
  - tqdm
  - rich

  # Code quality
  - black
  - ruff
  - isort
  - pre-commit
  - pytest
  - pytest-cov

  - pip:
    # Hydra config
    - hydra-core>=1.3.0
    - omegaconf>=2.3.0

    # Experiment tracking
    - wandb>=0.16.0

    # Model building
    - einops>=0.7.0
    - timm>=0.9.0

    # Explainability
    - shap>=0.44.0
    - captum>=0.7.0

    # Deployment
    - onnx>=1.15.0
    - onnxruntime-gpu>=1.17.0

    # Kaggle
    - kaggle>=1.6.0

    # NOTE: Install ARST in editable mode separately after env creation:
    #   conda run -n arst pip install -e ".[dev]"
